query storiesWithoutRelations(
  $filters: StoryFiltersInput
  $pagination: PaginationArg
  $sort: [String]
  $publicationState: PublicationState = LIVE
  $locale: I18NLocaleCode
  $minimal: Boolean = false
) {
  stories(
    filters: $filters
    pagination: $pagination
    sort: $sort
    publicationState: $publicationState
    locale: $locale
  ) {
    data {
      ...StoryFragment
      attributes {
        # include image component if minimal is true
        components @include(if: $minimal) {
          __typename
          ... on ComponentModulesImage {
            ...ComponentModulesImageFragment
          }
        }
      }
    }
    meta {
      ...ResponseCollectionMetaFragment
    }
  }
}

query storyWithoutRelations($id: ID, $locale: I18NLocaleCode) {
  story(id: $id, locale: $locale) {
    data {
      ...StoryFragment
    }
  }
}

# "$type" must be ENUM_TRIPLYRECORD_TYPE
query storiesLinkedToTriplyRecord($recordId: String!, $type: String!, $pagination: PaginationArg) {
  stories(
    pagination: $pagination
    filters: { triplyRecords: { recordId: { eq: $recordId }, type: { eq: $type } } }
  ) {
    data {
      id
      attributes {
        slug
        title
      }
    }
  }
}

query storiesLinkedToTriplyRecordExtended(
  $recordId: String!
  $type: String!
  $lang: I18NLocaleCode
  $publicationState: PublicationState = LIVE
) {
  stories(
    filters: { triplyRecords: { recordId: { eq: $recordId }, type: { eq: $type } } }
    locale: $lang
    publicationState: $publicationState
  ) {
    data {
      ...StoryFragment
    }
  }
}

query storiesLinkedToTheme($id: ID!, $locale: I18NLocaleCode, $page: Int, $pageSize: Int) {
  story(id: $id, locale: $locale) {
    data {
      id
      attributes {
        themes {
          data {
            id
            attributes {
              stories(pagination: { page: $page, pageSize: $pageSize }) {
                data {
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}

query storiesByIds($storiesIds: [ID]!) {
  stories(filters: { id: { in: $storiesIds } }) {
    data {
      attributes {
        title
        slug
        locale
        components {
          ... on ComponentModulesImage {
            ...ComponentModulesImageFragment
          }
        }
        localizations {
          data {
            ...StoryFragment
          }
        }
      }
    }
  }
}

query storyTriplyRelations($id: ID!, $type: String, $page: Int, $pageSize: Int) {
  story(id: $id) {
    data {
      id
      attributes {
        triplyRecords(
          filters: { type: { eq: $type } }
          pagination: { page: $page, pageSize: $pageSize }
        ) {
          data {
            ...BaseTriplyRecordFragment
          }
        }
      }
    }
  }
}

query storiesTotal {
  stories {
    meta {
      pagination {
        total
      }
    }
  }
}

query storyParentAndChildren($id: ID!) {
  story(id: $id) {
    data {
      id
      attributes {
        parent_story {
          data {
            id
          }
        }
        child_stories {
          data {
            id
          }
        }
      }
    }
  }
}

query storiesWithAuthors($pageSize: Int, $ids: [ID]!, $lang: I18NLocaleCode = "all") {
  stories(pagination: { pageSize: $pageSize }, filters: { id: { in: $ids } }, locale: $lang) {
    data {
      id
      attributes {
        authors {
          data {
            id
            attributes {
              firstName
              lastName
