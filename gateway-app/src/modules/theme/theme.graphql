query theme($id: ID, $locale: I18NLocaleCode) {
  theme(id: $id, locale: $locale) {
    data {
      ...ThemeFragment
    }
  }
}

query themes(
  $filters: ThemeFiltersInput
  $pagination: PaginationArg
  $sort: [String]
  $publicationState: PublicationState
  $locale: I18NLocaleCode
) {
  themes(
    filters: $filters
    pagination: $pagination
    sort: $sort
    publicationState: $publicationState
    locale: $locale
  ) {
    data {
      ...ThemeFragment
    }
    meta {
      ...ResponseCollectionMetaFragment
    }
  }
}

query themeIds(
  $filters: ThemeFiltersInput
  $pagination: PaginationArg
  $sort: [String]
  $publicationState: PublicationState
  $locale: I18NLocaleCode
) {
  themes(
    filters: $filters
    pagination: $pagination
    sort: $sort
    publicationState: $publicationState
    locale: $locale
  ) {
    data {
      id
    }
    meta {
      ...ResponseCollectionMetaFragment
    }
  }
}

fragment ThemeFragment on ThemeEntity {
  id
  attributes {
    name
    stories {
      data {
        ...StoryFragment
      }
    }
    createdAt
    updatedAt
    publishedAt
    localizations {
      data {
        id
      }
    }
    locale
  }
}

fragment ThemeFragmentWithHighlightedStories on ThemeEntity {
  id
  attributes {
    name
    stories(pagination: $highlightedStoriesPaginationArgs) {
      data {
        ...StoryFragment
      }
    }
    highlightedStories(pagination: $highlightedStoriesPaginationArgs) {
      data {
        ...StoryFragment
      }
    }
  }
}
