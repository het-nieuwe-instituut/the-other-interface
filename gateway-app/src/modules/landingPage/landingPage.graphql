  }
  grid {
    ...ComponentModulesGridModuleFragment
  }
}

query landingPageArchive($locale: I18NLocaleCode) {
  landingPageArchive(locale: $locale) {
    data {
      id
      attributes {
        ...LandingPageArchiveFragment
      }
    }
  }
}

