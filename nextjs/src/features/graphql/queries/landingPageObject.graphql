query landingPageArchive($locale: Locale!) {
  landingPageArchive(locale: $locale) {
    data {
      id
      attributes {
        ...LandingPageArchiveFragment
      }
    }
  }
}

fragment LandingPageArchiveFragment on LandingPageArchive {
  title
  text
  # carousels {
  #  ...carouselModuleFragment
  #}
  highlight {
    ...highlightModulesFragment
  }
  grid {
    ...gridModuleFragment
  }
}
