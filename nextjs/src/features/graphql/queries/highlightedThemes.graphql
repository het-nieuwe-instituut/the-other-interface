query highlightedHomepageThemes(
  $pagination: PaginationArg
  $publicationState: String
  $locale: String!
) {
  highlightedHomepageThemes(
    paginationArgs: $pagination
    publicationState: $publicationState
    locale: $locale
  ) {
    data {
      attributes {
        highlightedThemes {
          data {
            ...ThemeFragment
          }
        }
      }
    }
    meta(paginationArgs: $pagination, publicationState: $publicationState, locale: $locale) {
      pagination {
        total
        page
        pageCount
        pageSize
      }
    }
  }
}
