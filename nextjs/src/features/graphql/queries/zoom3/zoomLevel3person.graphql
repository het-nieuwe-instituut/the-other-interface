query ZoomLevel3People($id: String!, $locale: Locale!) {
  zoomLevel3People(id: $id, locale: $locale) {
    __typename
    id
    title
    thumbnail
    description
    asteriskSuggestions {
      asterisk_subject_description
      asterisk_date_description
      asterisk_name_description
    }
    # enrichedSources(locale: $locale) {
