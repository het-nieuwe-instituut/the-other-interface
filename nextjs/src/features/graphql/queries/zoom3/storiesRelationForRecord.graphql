query StoriesRelationForRecord($id: String!, $type: EntityNames!, $locale: Locale!) {
  zoomLevel3StoriesRelationsForRecord(type: $type, id: $id, locale: $locale) {
    type
    total
    stories {
      id
      __typename
      attributes {
        title
      }
      components {
        ... on ComponentModulesImage {
          ...imageModuleFragment
        }
      }
      authors {
        data {
          attributes {
            firstName
            lastName
            insertion
          }
        }
      }
      thumbnail {
        id
        alt_text
        imageThumbnail {
          data {
            ...UploadFileFragment
          }
        }
      }
    }
  }
}
