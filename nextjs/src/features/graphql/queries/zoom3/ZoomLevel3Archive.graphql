query ZoomLevel3Archive($id: String!, $locale: Locale!) {
  zoomLevel3Archive(id: $id, locale: $locale) {
    __typename
    id
    title
    thumbnail
    description
    enrichedSources(locale: $locale) {
      externalSourceType
      externalSourceUrl
      __typename
      id
      title
      thumbnail
      description
    }
  }
}
