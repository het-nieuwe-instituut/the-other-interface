query ZoomLevel3Object($id: String!, $locale: Locale!) {
  zoomLevel3Object(id: $id, locale: $locale) {
    id
    __typename
    title
    thumbnail
    description
    asteriskSuggestions {
      asterisk_date_title
      asterisk_name_title
      asterisk_subject_title
    }
    enrichedSources(locale: $locale) {
      externalSourceType
      externalSourceUrl
      __typename
      id
      title
      thumbnail
      description
    }
  }
}
