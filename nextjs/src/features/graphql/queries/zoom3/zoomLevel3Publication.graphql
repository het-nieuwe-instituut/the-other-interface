query ZoomLevel3Publication($id: String!, $locale: Locale!) {
  zoomLevel3Publication(id: $id, locale: $locale) {
    id
    __typename
    title
    thumbnail
    description
    enrichedSources(locale: $locale) {
      externalSourceType
      externalSourceUrl
      __typename
      id
      title
      thumbnail
      description
    }
    holding
    historyNotes
    annotation
  }
}
