query ZoomLevel3PeopleRecord($id: String!, $locale: Locale!) {
  peopleRecordZoomLevel3(id: $id, locale: $locale) {
    __typename
    type
    profession
    nameVariation
    birthDate
    birthPlace
    deathDate
    deathPlace
    nationality
    gender
    period
    association
    permanentLink
    externalSource
    enrichedSources(locale: $locale) {
      id
      externalSourceType
      externalSourceUrl
      type
      profession
      nameVariation
      birthDate
      birthPlace
      deathDate
      deathPlace
      nationality
      gender
      period
      association
      permanentLink
      externalSource
    }
  }
}
