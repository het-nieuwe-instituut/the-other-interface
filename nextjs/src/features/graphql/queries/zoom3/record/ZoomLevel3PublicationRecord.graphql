query ZoomLevel3PublicationRecord($id: String!, $locale: Locale!) {
  publicationsRecordZoomLevel3(id: $id, locale: $locale) {
    __typename
    id
    objectNumber
    subType
    authors
    authorRole
    publisher
    yearOfPublication
    placeOfPublication
    isbn
    codeOfArchive
    edition
    illustration
    pages
    language
    series
    number
    category
    relatedKeyword
    geoKeyword
    availability
    permanentLink
    externalSource
    continuedFrom
    continuedAs
    geographicalKeywords
    pysicalCarrier
    volume
    issue
    year
    enrichedSources(locale: $locale) {
      id
      externalSourceType
      externalSourceUrl
      objectNumber
      subType
      authors
      authorRole
      publisher
      yearOfPublication
      placeOfPublication
      isbn
      codeOfArchive
      edition
      illustration
      pages
      language
      series
      number
      category
      relatedKeyword
      geoKeyword
      availability
      permanentLink
      externalSource
      continuedFrom
      continuedAs
      geographicalKeywords
      pysicalCarrier
      volume
      issue
      year
    }
  }
}
