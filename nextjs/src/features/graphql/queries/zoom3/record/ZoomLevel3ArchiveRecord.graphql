query ZoomLevel3ArchiveRecord($id: String!, $locale: Locale!) {
  archivesRecordZoomLevel3(id: $id, locale: $locale) {
    __typename
    referenceCode
    titleType
    descriptionLevel
    size
    period
    access
    photographCreator
    rights
    permanentLink
    externalSource
    description
    custodialHistory
    systemOfArrangement
    sources
    existence
    existenceLocation
    enrichedSources(locale: $locale) {
      id
      externalSourceType
      externalSourceUrl
      __typename
      referenceCode
      titleType
      descriptionLevel
      size
      period
      access
      photographCreator
      rights
      permanentLink
      externalSource
      description
      custodialHistory
      systemOfArrangement
      sources
      existence
      existenceLocation
    }
  }
}
