query StoryHoverRecordRelations($id: String!, $locale: Locale!) {
  story(id: $id, locale: $locale) {
    data {
      id
      attributes {
        title
        shortDescription
      }
      author {
        data {
          id
          attributes {
            firstName
            lastName
            insertion
          }
        }
      }
      authors {
        data {
          id
          attributes {
            firstName
            lastName
            insertion
          }
        }
      }
    }
  }
}
