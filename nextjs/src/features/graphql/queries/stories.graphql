query stories($pagination: PaginationArg, $locale: Locale!) {
  stories(pagination: $pagination, locale: $locale) {
    data {
      id
      attributes {
        title
        slug
        shortDescription
      }
    }
    meta {
      pagination {
        page
      }
    }
  }
}

query searchByStories($searchTerm: String, $page: Int, $pageSize: Int, $filterTerm: ID) {
  stories(
    filters: {
      or: [
        {
          and: [
            { locations: { id: { eq: $filterTerm } } }
            {
              or: [
                { title: { containsi: $searchTerm } }
                { description: { containsi: $searchTerm } }
                { shortDescription: { containsi: $searchTerm } }
              ]
            }
          ]
        }
        {
          or: [
            { title: { containsi: $searchTerm } }
            { description: { containsi: $searchTerm } }
            { shortDescription: { containsi: $searchTerm } }
          ]
        }
      ]
    }
    pagination: { page: $page, pageSize: $pageSize }
    locale: nl
  ) {
    data {
      id
      attributes {
        title
        components {
          ... on ComponentModulesImage {
            ...imageModuleFragment
          }
        }
      }
    }
    meta {
      pagination {
        page
        total
      }
    }
  }
}
