query stories($pagination: PaginationArg, $locale: Locale!) {
  stories(pagination: $pagination, locale: $locale) {
    data {
      id
      attributes {
        title
        slug
        shortDescription
      }
    }
    meta {
      pagination {
        page
      }
    }
  }
}

query searchByStories(
  $searchTerm: String
  $page: Int
  $pageSize: Int
  $locale: Locale!
  $filterTerm: String
) {
  stories(
    filters: {
      or: [
        { title: { containsi: $searchTerm } }
        { description: { containsi: $searchTerm } }
        { shortDescription: { containsi: $searchTerm } }
        { themes: { name: { containsi: $filterTerm } } }
        #  { locations: { city: { containsi: $filterTerm } } }
        #  { author: { lastName: { containsi: $filterTerm } } }
        #  { author: { firstName: { containsi: $filterTerm } } }
      ]
    }
    pagination: { page: $page, pageSize: $pageSize }
    locale: $locale
  ) {
    data {
      id
      attributes {
        title
        components {
          ... on ComponentModulesImage {
            ...imageModuleFragment
          }
        }
      }
    }
    meta {
      pagination {
        page
        total
      }
    }
  }
}
