query stories($pagination: PaginationArg, $locale: Locale!) {
  stories(pagination: $pagination, locale: $locale) {
    data {
      id
      attributes {
        title
        slug
        shortDescription
      }
    }
    meta {
      pagination {
        page
      }
    }
  }
}

query searchByStories(
  $searchTerm: String
  $page: Int
  $pageSize: Int
  $locationsFilterTerm: ID
  $themesFilterTerm: ID
  $authorFilterTerm: ID
  $locale: Locale!
) {
  stories(
    filters: {
      and: [
        {
          or: [
            { locations: { id: { eq: $locationsFilterTerm } } }
            { themes: { id: { eq: $themesFilterTerm } } }
            { author: { id: { eq: $authorFilterTerm } } }
          ]
        }
        {
          or: [
            { title: { containsi: $searchTerm } }
            { description: { containsi: $searchTerm } }
            { shortDescription: { containsi: $searchTerm } }
          ]
        }
      ]
      or: [
        { title: { containsi: $searchTerm } }
        { description: { containsi: $searchTerm } }
        { shortDescription: { containsi: $searchTerm } }
      ]
    }
    pagination: { page: $page, pageSize: $pageSize }
    locale: $locale
  ) {
    data {
      id
      attributes {
        title
      }
      components {
        ... on ComponentModulesImage {
          ...imageModuleFragment
        }
      }
    }
    meta {
      pagination {
        page
        total
      }
    }
  }
}
