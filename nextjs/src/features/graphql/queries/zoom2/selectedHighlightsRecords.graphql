query searchBySelectedHighlights($filters: TriplyRecordFiltersInput, $page: Int, $pageSize: Int) {
  triplyRecords(filters: $filters, pagination: { page: $page, pageSize: $pageSize }) {
    data {
      id
      attributes {
        label
        type
      }
    }
    meta {
      pagination {
        page
        total
      }
    }
  }
}
