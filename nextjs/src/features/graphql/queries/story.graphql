query storyById($locale: Locale!, $id: String!, $publicationState: String) {
  storyByLocale(locale: $locale, id: $id, publicationState: $publicationState) {
    data {
      id
      __typename
      attributes {
        title
        description
        locale
      }
      storyLinks {
        ... on ComponentModulesButtonsModule {
          ...buttonsModuleFragment
        }
      }
      child_stories {
        id
        attributes {
          title
          slug
          locale
        }
      }
      parent_story {
        data {
          id
          attributes {
            title
            slug
            locale
          }
        }
      }
      themes {
        id
      }
      thumbnail {
        id
        alt_text
        imageThumbnail {
          data {
            ...UploadFileFragment
          }
        }
      }
      components {
        ... on ComponentModulesTextModule {
          ...textModuleFragment
        }
        ... on ComponentModulesImage {
          ...imageModuleFragment
        }
        ... on ComponentModulesPullquote {
          ...pullquoteModuleFragment
        }
        ... on ComponentModulesTitleModule {
          ...titleModuleFragment
        }
        ... on ComponentModulesImageCarousel {
          ...imageCarouselModuleFragment
        }
        ... on ComponentModulesButtonsModule {
          ...buttonsModuleFragment
        }
        ... on ComponentModulesStandaloneLinks {
          ...standaloneLinksModuleFragment
        }
        ... on ComponentModulesSubtitle {
          ...subtitleModuleFragment
        }
        ... on ComponentCoreStandAloneLink {
          ...standAloneLinkFragment
        }
        ... on ComponentCoreMuxAudio {
          ...muxAudioFragment
        }
        ... on ComponentCoreMuxVideo {
          ...muxVideoFragment
        }
        ... on ComponentModulesSideImageWithText {
          ...sideImageWithTextModuleFragment
        }
      }
      triplyRecords {
        ...BaseTriplyRecordFragment
      }
    }
  }
}

query storyImages($id: String!, $locale: Locale!) {
  story(id: $id, locale: $locale) {
    data {
      id
      components {
        ... on ComponentModulesImage {
          ...imageModuleFragment
        }
      }
    }
  }
}

query storyMetaById($locale: Locale!, $id: String!, $publicationState: String) {
  storyByLocale(locale: $locale, id: $id, publicationState: $publicationState) {
    data {
      id
      __typename
      attributes {
        title
        description
        shortDescription
        createdAt
        updatedAt
        publishedAt
      }
      authors {
        data {
          id
          attributes {
            firstName
            lastName
            insertion
          }
        }
      }
      publicationDate {
        id
        date
        displayType
      }
      locations {
        id
        attributes {
          city
        }
      }
      timeframe {
        id
        yearStart
        yearEnd
      }
      themes {
        id
        attributes {
          name
        }
      }
      triplyRecords {
        id
        attributes {
          type
          recordId
          people(locale: $locale) {
            title
          }
        }
      }
      storyLinks {
        ... on ComponentModulesButtonsModule {
          ...buttonsModuleFragment
        }
      }
      child_stories {
        id
        attributes {
          title
        }
        components {
          ... on ComponentModulesImage {
            ...imageModuleFragment
          }
        }
        authors {
          data {
            id
            attributes {
              firstName
              lastName
              insertion
            }
          }
        }
      }
      parent_story {
        data {
          id
          attributes {
            title
          }
          components {
            ... on ComponentModulesImage {
              ...imageModuleFragment
            }
          }
          authors {
            data {
              id
              attributes {
                firstName
                lastName
                insertion
              }
            }
          }
        }
      }
      siblings {
        id
        attributes {
          title
        }
        components {
          ... on ComponentModulesImage {
            ...imageModuleFragment
          }
        }
        authors {
          data {
            id
            attributes {
              firstName
              lastName
              insertion
            }
          }
        }
      }
    }
  }
}
