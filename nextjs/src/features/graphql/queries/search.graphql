query searchAll($text: String! $page: Int!, $pageSize: Int) {
    searchByAllCategories(page: $page, pageSize: $pageSize, text: $text) {
        page,
        nodes {
            title
			thumbnail
			id
            type
        }
        total
    }
}

query searchAllAmount($text: String!) {
    searchByAllCategoriesAmount(text: $text) {
        total
    }
}