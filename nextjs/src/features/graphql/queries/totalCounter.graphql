query totalCounter(
  $locale: Locale!
  $selectedFilterSuggestions: [SelectedFilterSuggestion!]
  $locationsFilterTerm: ID
  $themesFilterTerm: ID
  $authorFilterTerm: ID
  $searchTerm: String
  $includeStories: Boolean = false
  $includeArchives: Boolean = false
  $includeObjects: Boolean = false
  $includePeople: Boolean = false
  $includePublications: Boolean = false
) {
  stories(
    filters: {
      and: [
        {
          or: [
            { locations: { id: { eq: $locationsFilterTerm } } }
            { themes: { id: { eq: $themesFilterTerm } } }
            { author: { id: { eq: $authorFilterTerm } } }
          ]
        }
        {
          or: [
            { title: { containsi: $searchTerm } }
            { description: { containsi: $searchTerm } }
            { shortDescription: { containsi: $searchTerm } }
          ]
        }
      ]
      or: [
        { title: { containsi: $searchTerm } }
        { description: { containsi: $searchTerm } }
        { shortDescription: { containsi: $searchTerm } }
      ]
    }
    pagination: { page: 1, pageSize: 1 }
    locale: $locale
  ) @include(if: $includeStories) {
    meta {
      pagination {
        total
      }
    }
  }
  archives: zoomLevel2Amount(
    entityName: Archives
    locale: $locale
    selectedFilterSuggestions: $selectedFilterSuggestions
    text: $searchTerm
  ) @include(if: $includeArchives) {
    total
  }
  objects: zoomLevel2Amount(
    entityName: Objects
    locale: $locale
    selectedFilterSuggestions: $selectedFilterSuggestions
    text: $searchTerm
  ) @include(if: $includeObjects) {
    total
  }
  people: zoomLevel2Amount(
    entityName: People
    locale: $locale
    selectedFilterSuggestions: $selectedFilterSuggestions
    text: $searchTerm
  ) @include(if: $includePeople) {
    total
  }
  publications: zoomLevel2Amount(
    entityName: Publications
    locale: $locale
    selectedFilterSuggestions: $selectedFilterSuggestions
    text: $searchTerm
  ) @include(if: $includePublications) {
    total
  }
}
