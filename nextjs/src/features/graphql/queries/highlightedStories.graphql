query highlightedHomepageStories($publicationState: String, $locale: String!) {
  highlightedHomepageStories(publicationState: $publicationState, locale: $locale) {
    data {
      id
      attributes {
        highlightedStories {
          data {
            attributes {
              title
            }
          }
        }
      }
    }
  }
}
