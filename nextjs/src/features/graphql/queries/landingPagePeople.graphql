query landingPagePeople($locale: Locale!) {
  landingPagePeople(locale: $locale) {
    data {
      id
      attributes {
        ...LandingPagePeopleFragment
      }
    }
  }
}

fragment LandingPagePeopleFragment on LandingPagePeople {
  title
  text
  # carousels {
  #  ...carouselModuleFragment
  #}
  #highlight {
  # ......highlightModulesFragment
  #}
  grid {
    ...gridModuleFragment
  }
}
