fragment ThemeFragment on ThemeEntity {
  id
  attributes {
    name
    stories {
      data {
        ...StoryFragment
      }
    }
    createdAt
    updatedAt
    publishedAt
    localizations {
      data {
        id
      }
    }
    locale
  }
}

fragment ThemeFragmentWithHighlightedStories on ThemeEntity {
  id
  attributes {
    name
    stories {
      data {
        ...StoryWithoutRelationsFragment
        attributes {
          components {
            ... on ComponentModulesImage {
              ...imageModuleFragment
            }
          }
        }
      }
    }
    highlightedStories {
      data {
        ...StoryWithoutRelationsFragment
        attributes {
          components {
            ... on ComponentModulesImage {
              ...imageModuleFragment
            }
          }
        }
      }
    }
  }
}
