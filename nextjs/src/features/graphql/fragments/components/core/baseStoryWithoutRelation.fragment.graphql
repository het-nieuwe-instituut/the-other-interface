fragment StoryWithoutRelationsFragment on StoryEntity {
  id
  authors {
    data {
      attributes {
        firstName
      }
    }
  }
  thumbnail {
    id
    alt_text
    imageThumbnail {
      data {
        ...UploadFileFragment
      }
    }
  }
  attributes {
    title
    slug
    description
    shortDescription
    createdAt
    updatedAt
    publishedAt
    locale
  }
}
