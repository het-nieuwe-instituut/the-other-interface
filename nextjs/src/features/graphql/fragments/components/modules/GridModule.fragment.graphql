fragment gridModuleFragment on ComponentModulesGridModule {
  __typename
  id
  title
  exploreCollectionButton {
    id
    text
    url
  }
  cards {
    id
    title
    subtitle
    thumbnail {
      data {
        id
        attributes {
          url
          alternativeText
        }
      }
    }
    story {
      data {
        id
        attributes {
          slug
          author {
            data {
              attributes {
                firstName
              }
            }
          }
          updatedAt
        }
      }
    }
    triplyRecord {
      data {
        attributes {
          recordId
        }
      }
    }
  }
}
