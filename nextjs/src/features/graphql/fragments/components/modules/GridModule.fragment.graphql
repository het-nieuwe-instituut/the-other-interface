fragment gridModuleFragment on ComponentModulesGridModule {
  __typename
  id
  title
  exploreCollectionButton {
    id
    text
    url
  }
  cards {
    id
    title
    subtitle
    thumbnail {
      data {
        id
        attributes {
          url
          alternativeText
        }
      }
    }
    story {
      data {
        id
        attributes {
          slug
          updatedAt
        }
        authors {
          data {
            attributes {
              firstName
            }
          }
        }
        thumbnail {
          id
          alt_text
          imageThumbnail {
            data {
              ...UploadFileFragment
            }
          }
        }
      }
    }
    triplyRecord {
      data {
        attributes {
          type
          recordId
        }
      }
    }
  }
}
