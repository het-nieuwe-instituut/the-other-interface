#import '../core/baseStoryWithoutRelation.fragment.graphql'
#import '../core/baseTriplyRecord.fragment.graphql'
#import '../core/button.graphql'

fragment carouselModuleFragment on ComponentModulesCarousel {
  id
  __typename
  title
  variant
  explore_collection_button {
    ...ButtonFragment
  }
  images {
    id
    image {
      data {
        attributes {
          url
        }
      }
    }
    alt_text
    title
    description
    triply_record {
      data {
        ...BaseTriplyRecordFragment
      }
    }
    story {
      data {
        id
        attributes {
          title
        }
      }
    }
  }
}
